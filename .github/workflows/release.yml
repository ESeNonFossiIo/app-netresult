name: release
# Releases are normally published locally with `make publish`. Run this by hand (Actions > release > Run workflow)
# to build and publish an existing tag from CI; it needs the signing secrets described in DEVELOPING.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.2.0"
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag }}
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Tag must match versionName
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ "$TAG" = "v$VERSION" ] || { echo "Tag $TAG does not match versionName $VERSION"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build
        env:
          KEYSTORE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle testDebugUnitTest assembleRelease
      - name: Verify APK version and signing key
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          [ -n "$RELEASE_CERT_SHA256" ] || { echo "Repository variable RELEASE_CERT_SHA256 is not set"; exit 1; }
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          for m in app wear; do
            [ "$(ls $m/build/outputs/apk/release/*.apk | wc -l)" = 1 ] || { echo "Expected exactly one release APK in $m"; exit 1; }
            APK=$(ls $m/build/outputs/apk/release/*.apk)
            "$TOOLS/aapt2" dump badging "$APK" | grep -q "versionName='${TAG#v}'" \
              || { echo "$APK does not contain version ${TAG#v}"; exit 1; }
            CERT=$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p')
            [ "$CERT" = "$RELEASE_CERT_SHA256" ] || { echo "$APK is signed with $CERT, expected $RELEASE_CERT_SHA256"; exit 1; }
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `make publish` may already have created this release from a local build.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          mkdir dist
          cp app/build/outputs/apk/release/*.apk wear/build/outputs/apk/release/*.apk dist/
          (cd dist && sha256sum *.apk > SHA256SUMS)
          gh release create "$TAG" dist/* \
            --title "Net Result $TAG" --generate-notes
