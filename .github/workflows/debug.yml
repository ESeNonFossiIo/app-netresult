name: debug
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests and debug APK
        working-directory: kotlin
        run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: netresult-debug
          path: |
            kotlin/app/build/outputs/apk/debug/*.apk
            kotlin/wear/build/outputs/apk/debug/*.apk
